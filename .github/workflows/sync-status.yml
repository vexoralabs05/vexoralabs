name: Refresh Vexora Status
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vexora-status-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh service status
        env:
          VEXORA_STATUS_API_KEY: ${{ secrets.VEXORA_STATUS_API_KEY }}
        run: python scripts/sync_status.py
      - name: Commit updated status feed
        run: |
          if git diff --quiet -- data/status.json; then
            echo "No status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git commit -m "chore: refresh service status"
          git push
