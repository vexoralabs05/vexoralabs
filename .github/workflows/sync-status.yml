name: Sync PXN Status
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vexora-status-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize PXN public status
        env:
          PXN_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PXN_SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/sync_status.py
      - name: Commit updated status data
        run: |
          if git diff --quiet -- data/status.json; then
            echo "No status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git commit -m "chore: sync PXN status"
          git push
