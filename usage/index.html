
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>VEXORA | VPN Usage</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080d18;
      color: #f5f7fb;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 25px;
      border: 1px solid #24344b;
      border-radius: 22px;
      background: #101a2a;
      box-shadow: 0 20px 70px #0008;
    }
    .brand {
      color: #38a5ff;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 4px;
      text-align: center;
    }
    .subtitle {
      color: #8fa3bc;
      font-size: 11px;
      letter-spacing: 2px;
      text-align: center;
      margin: 8px 0 35px;
    }
    h2 { text-align: center; font-size: 23px; }
    .description {
      color: #9aabc0;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }
    label {
      display: block;
      margin: 25px 0 9px;
      color: #b8c8dc;
      font-size: 12px;
    }
    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #34465f;
      border-radius: 11px;
      background: #0a1321;
      color: white;
      outline: none;
      font-size: 15px;
    }
    input:focus { border-color: #2997ff; }
    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #1687f8;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message {
      min-height: 24px;
      margin-top: 17px;
      color: #9aabc0;
      font-size: 13px;
      text-align: center;
    }
    footer {
      margin-top: 30px;
      color: #71839b;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">VEXORA</div>
    <div class="subtitle">VPN CUSTOMER PORTAL</div>

    <h2>Check Your Data Usage</h2>
    <p class="description">
      Enter your Subscription ID to view
      your personal VPN usage information.
    </p>

    <form id="usageForm">
      <label for="subscriptionId">SUBSCRIPTION ID</label>
      <input
        id="subscriptionId"
        type="text"
        placeholder="Enter your Subscription ID"
        autocomplete="off"
        required
        maxlength="100"
      >
      <button id="submitBtn" type="submit">
        Check My Usage
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <footer>
      SECURE VPN USAGE PORTAL<br><br>
      © VEXORA Labs
    </footer>
  </main>

  <script>
    const form = document.getElementById("usageForm");
    const button = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const id = document.getElementById("subscriptionId")
        .value.trim();

      if (!id) return;

      message.textContent =
        "Portal interface ready. Backend connection pending.";

      // Secure usage API will be connected in Phase 2.
    });
  </script>
</body>
</html>
